import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// The catalog is the single source for registration and generated resources.
abstract class GenerateSmogContent extends DefaultTask {
    @InputFile abstract RegularFileProperty getCatalogFile()
    @InputDirectory abstract DirectoryProperty getToolMaterialsDirectory()
    @InputFile abstract RegularFileProperty getToolTemplatesFile()
    @OutputDirectory abstract DirectoryProperty getTargetDirectory()
    @javax.inject.Inject abstract FileSystemOperations getFileSystem()
    @TaskAction void generate() {
        def root = new JsonSlurper().parse(catalogFile.get().asFile)
        def materialData=[materials:toolMaterialsDirectory.get().asFile.listFiles().findAll { it.isFile()&&it.name.endsWith('.json') }.sort { it.name }.collect { new JsonSlurper().parse(it) }]
        def materialIds=new HashSet<String>()
        materialData.materials.each { material ->
            if (!(material.id instanceof String) || !(material.id ==~ /[a-z0-9_]+/)) throw new GradleException("Invalid tool material id: ${material.id}")
            if (!materialIds.add(material.id)) throw new GradleException("Duplicate tool material id: ${material.id}")
        }
        def templateData=new JsonSlurper().parse(toolTemplatesFile.get().asFile)
        root.tool_materials=materialData.materials;root.tool_forms=templateData.forms;root.tool_templates=templateData.templates.collect { schema ->
            def copy=new LinkedHashMap(schema);copy.parts=[]
            schema.parts.each { role -> int copies=role.containsKey('count')?role.count:1;if(copies<1||copies>254)throw new GradleException('Invalid tool part count');(0..<copies).each { number -> def expanded=new LinkedHashMap(role);expanded.remove('count');expanded.id=copies==1?role.id:"${role.id}_${number+1}";copy.parts.add(expanded) } }
            if(copy.parts.size()>254)throw new GradleException('Tool exceeds native component container limit')
            copy
        };root.tool_parts=[:]
        root.tool_materials.each { material -> root.tool_forms.each { form ->
            def profile=material.profiles[form.category]
            if(profile!=null&&(!profile.containsKey('forms')||form.id in profile.forms)) {
                def variants=[false];if(form.category=='head'&&profile.casting)variants.add(true)
                variants.each { cast ->
                    def partName=cast?"${material.id}_cast_${form.id}":form.aliases?.get(material.id)?:"${material.id}_${form.id}"
                    root.tool_parts["smog:$partName"]=[material:material.id,form:form.id,cast:cast]
                    root.items.add([name:partName,kind:'tool_part',display:"${material.name.en_us}: ${cast?'Casting - ':''}${form.name.en_us}",display_ru:"${material.name.ru_ru}: ${cast?'Отливка — ':''}${form.name.ru_ru}",tab:'copper_age'])
                }
            }
        } }
        root.tool_forms.findAll { it.category=='head' }.each { form ->
            def moldName=form.id.replaceFirst(/_head$/,'_mold')
            [false,true].each { raw -> root.items.add([name:(raw?'unfired_':'')+moldName,kind:'tool_mold',form:form.id,raw:raw,display:(raw?'Unfired mold: ':'Mold: ')+form.name.en_us,display_ru:(raw?'Сырая форма: ':'Форма: ')+form.name.ru_ru,tab:'copper_age']) }
            root.pottery.add([input:'minecraft:clay_ball',count:form.mold_clay ?: 3,output:"smog:unfired_$moldName"])
            root.firing.add([input:"smog:unfired_$moldName",output:"smog:$moldName"])
            root.tags.find { it.registry=='item'&&it.id=='c:unfired_ceramics' }.values.add("smog:unfired_$moldName")
        }
        def castingShapes=[[id:'ingot',en:'Ingot',ru:'слитка'],[id:'plate',en:'Plate',ru:'пластины'],[id:'fitting',en:'Fitting',ru:'фитинга'],[id:'pipe',en:'Pipe',ru:'трубы']]+root.tool_forms.findAll { it.category=='head' }.collect { [id:it.id.replaceFirst(/_head$/,''),en:it.name.en_us,ru:it.name.ru_ru] }
        castingShapes.each { shape -> ['sand','metal'].each { style -> root.items.add([name:"${style}_${shape.id}_mold",kind:'mold_variant',base_mold:"${shape.id}_mold",style:style,display:(style=='sand'?'Sand mold: ':'Metal cast: ')+shape.en,display_ru:(style=='sand'?'Песчаная форма: ':'Металлическая форма: ')+shape.ru,tab:'copper_age']) } }
        root.tool_templates.each { schema ->
            def memberships=['minecraft:enchantable/durability']
            def miningForms=schema.parts.findAll { it.category=='head' }.collectMany { role -> root.tool_forms.findAll { form -> form.category=='head'&&(!role.forms||form.id in role.forms)&&form.mining_tag } }
            if(miningForms){memberships.addAll(['minecraft:enchantable/mining','minecraft:enchantable/mining_loot']);miningForms.each { form -> def family=form.mining_tag.split('/').last();memberships.add('minecraft:'+['pickaxe':'pickaxes','axe':'axes','shovel':'shovels','hoe':'hoes'].get(family,'pickaxes')) }}
            root.items.add([name:"modular_${schema.id}",kind:'modular_tool',template:schema.id,display:"Assembled ${schema.name.en_us}",display_ru:"Составной инструмент: ${schema.name.ru_ru}",tags:memberships.unique(),tab:'copper_age'])
        }
        def directory = targetDirectory.get().asFile
        fileSystem.delete { delete(directory) }
        def write = { String path, Object value ->
            def target = new File(directory, path)
            target.parentFile.mkdirs()
            target.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
        }
        def validId = { String id ->
            if (!(id ==~ /[a-z0-9_.-]+:[a-z0-9_\/-]+/) || id.contains('..')) throw new GradleException("Invalid identifier: $id")
            id
        }
        def names = [] as Set
        def claim = { String name ->
            validId("smog:$name")
            if (!names.add(name)) throw new GradleException("Duplicate content: $name")
        }
        def tags = [:].withDefault { [] as Set }
        def tag = { String registry, String id, String value ->
            validId(id); validId(value.startsWith('#') ? value.substring(1) : value)
            def pieces = id.split(':', 2)
            tags["data/${pieces[0]}/tags/$registry/${pieces[1]}.json"].add(value)
        }
        def en = [:]; def ru = [:]
        def item = { String name, String english, String russian, List memberships ->
            claim(name)
            if(!(root.items ?: []).any { it.name==name && it.model })write("assets/smog/models/item/${name}.json", [parent:'minecraft:item/generated',textures:[layer0:"smog:item/$name"]])
            write("assets/smog/items/${name}.json", [model:[type:'minecraft:model',model:"smog:item/$name"]])
            en["item.smog.$name"] = english; ru["item.smog.$name"] = russian
            memberships.each { t -> tag('item', t, "smog:$name") }
        }
        def recipe = { String name, Map data, String unlock ->
            write("data/smog/recipe/${name}.json", data)
            write("data/smog/advancement/recipes/${name}.json", [parent:'minecraft:recipes/root',
                criteria:[has_material:[trigger:'minecraft:inventory_changed',conditions:[items:[[items:unlock]]]]],
                requirements:[['has_material']],rewards:[recipes:["smog:$name"]]])
        }
        def shapeless = { String name, List ingredients, String output, int count ->
            recipe(name, [type:'minecraft:crafting_shapeless',ingredients:ingredients,result:[id:output,count:count]], ingredients[0])
        }
        def compact = { String name, String ingredient, String output ->
            recipe(name, [type:'minecraft:crafting_shaped',category:'building',pattern:['###','###','###'],key:['#':ingredient],result:[id:output]], ingredient)
        }
        def block = { Map entry, String name, String texture, boolean machine ->
            claim(name); validId(texture)
            def id = "smog:$name"
            def baseModel = entry.model ?: "smog:block/$name"
            validId(baseModel)
            if (!entry.model) write("assets/smog/models/block/${name}.json", [parent:'minecraft:block/cube_all', textures:[all:texture]])
            def variants = ['':[model:baseModel]]
            if(entry.horizontal){variants=[:];[north:0,east:90,south:180,west:270].each { facing,rotation -> if(entry.valve){variants["facing=$facing,open=false"]=[model:baseModel,y:rotation];variants["facing=$facing,open=true"]=[model:"smog:block/${name}_open",y:rotation]}else variants["facing=$facing"]=[model:baseModel,y:rotation] }}
            if (machine) {
                boolean modular=(root.complex_multiblocks ?: []).any { it.controller=="smog:$name" }
                def assembled = entry.assembled_model ?: "smog:block/${name}_assembled"
                validId(assembled)
                if (!modular && !entry.assembled_model) write("assets/smog/models/block/${name}_assembled.json", [parent:'minecraft:block/cube_all', textures:[all:entry.assembled_texture ?: texture]])
                variants = [:]
                if(entry.kind == 'CONNECTOR') {
                    [up:[0,0],down:[180,0],north:[90,0],east:[90,90],south:[90,180],west:[90,270]].each { attachment,angles ->
                        variants["attachment=$attachment"]=[model:baseModel,x:angles[0],y:angles[1]]
                    }
                } else [north:0, east:90, south:180, west:270].each { facing, rotation ->
                    [false,true].each { built ->
                        if(entry.kind == 'GENERATOR_CONTROLLER') ['none','solar','lightning','thermal','flow','wind','steam','geothermal'].each { kind ->
                            variants["assembled=$built,facing=$facing,generator=$kind"] = [model:built && kind != 'none' ? "smog:block/generator_$kind" : baseModel,y:rotation]
                        }
                        else variants["assembled=$built,facing=$facing"] = [model:built && !modular ? assembled : baseModel, y:rotation]
                    }
                }
            }
            if(entry.pipe){
                def parts=[[apply:[model:"smog:block/${name}_core"]]]
                [north:[0,0],east:[0,90],south:[0,180],west:[0,270],up:[270,0],down:[90,0]].each { direction,angles ->
                    parts.add([when:[(direction):'true'],apply:[model:"smog:block/${name}_arm",x:angles[0],y:angles[1]]])
                }
                write("assets/smog/blockstates/${name}.json",[multipart:parts])
            }else write("assets/smog/blockstates/${name}.json", [variants:variants])
            if(entry.render_parts)write("assets/smog/items/${name}.json",[model:[type:'minecraft:select',property:'minecraft:custom_model_data',index:0,cases:entry.render_parts.collect { part -> [when:part,model:[type:'minecraft:model',model:"smog:block/${name}_${part}"]] },fallback:[type:'minecraft:model',model:baseModel]]])
            else write("assets/smog/items/${name}.json", [model:[type:'minecraft:model', model:baseModel]])
            def drop = entry.drop ?: id
            validId(drop)
            def lootEntry = [type:'minecraft:item', name:drop]
            if (drop != id) lootEntry = [type:'minecraft:alternatives', children:[
                [type:'minecraft:item', name:id, condition:'minecraft:tool/can_silk_touch'],
                [type:'minecraft:item', name:drop, modifier:[[type:'minecraft:apply_bonus', enchantment:'minecraft:fortune', formula:'minecraft:ore_drops'],[type:'minecraft:explosion_decay']]]
            ]]
            write("data/smog/loot_table/blocks/${name}.json", [type:'minecraft:block', pools:[[rolls:1, entries:[lootEntry], condition:[type:'minecraft:survives_explosion']]]])
            tag('block', 'minecraft:mineable/pickaxe', id)
            def miningLevel=entry.mining_level ?: 'stone'
            if(!(miningLevel in ['wood','stone','iron','diamond','netherite']))throw new GradleException("Invalid mining level: $miningLevel")
            if(miningLevel!='wood')tag('block',entry.tool_tag ?: "minecraft:needs_${miningLevel=='netherite'?'diamond':miningLevel}_tool",id)
            if(miningLevel=='netherite') {
                tag('block','smog:needs_netherite_tool',id)
                tag('block','minecraft:incorrect_for_diamond_tool',id)
            }
            (entry.tags ?: []).each { t -> tag('block', t, id); tag('item', t, id) }
            en["block.smog.$name"] = entry.display ?: name
            ru["block.smog.$name"] = entry.display_ru ?: entry.display ?: name
        }
        root.blocks.each { block(it, it.name, it.texture, false) }
        def resourcePlacement={ Map entry ->
            def modifiers=[]
            if((entry.rarity ?: 1)>1)modifiers.add([type:'minecraft:rarity_filter',chance:entry.rarity])
            modifiers.add([type:'minecraft:count',count:entry.veins_per_chunk ?: 1]);modifiers.add([type:'minecraft:in_square'])
            if(entry.generation_profile in ['shallow','placer']) {
                modifiers.add([type:'minecraft:heightmap',heightmap:'OCEAN_FLOOR_WG'])
                int depth=entry.surface_depth ?: 5
                modifiers.add([type:'minecraft:offset',x:0,y:[type:'minecraft:uniform',min_inclusive:-depth-2,max_inclusive:-depth],z:0])
            } else modifiers.add([type:'minecraft:height_range',height:[type:'minecraft:'+ (entry.height_distribution ?: 'uniform'),min_inclusive:[absolute:entry.min_y],max_inclusive:[absolute:entry.max_y]]])
            modifiers.add([type:'minecraft:biome']);return modifiers
        };
        def naturalMass={ String id,String stoneState,String deepState,Map entry ->
            write("data/smog/worldgen/feature/${id}.json",[type:'smog:resource_deposit',stone_state:stoneState,deep_state:deepState,radius:entry.radius,thickness:entry.thickness,shape:entry.generation_profile,contained:entry.generation_profile=='reservoir'])
            write("data/smog/worldgen/placed_feature/${id}.json",[feature:"smog:$id",placement:resourcePlacement(entry)])
        };
        root.ores.each { ore ->
            def profile=ore.generation_profile ?: 'accessible_vein'
            def defaults=[veins_per_chunk:1,biomes:'overworld',product:'ingot',generation_profile:profile]
            if(profile in ['accessible_vein','special_vein'])defaults.vein_size=8
            if(!(profile in ['shallow','placer'])){defaults.min_y=-64;defaults.max_y=64}
            defaults.each { key,value -> if(!ore.containsKey(key))ore[key]=value }
            if((profile in ['accessible_vein','special_vein'] && (ore.vein_size<1 || ore.vein_size>64)) || ore.veins_per_chunk<1 || (!(profile in ['shallow','placer']) && ore.min_y>ore.max_y))throw new GradleException("Invalid ore generation: ${ore.name}")
            def name = "${ore.name}_ore"
            def material = ore.name
            def english = ore.material ?: material.capitalize()
            def russian = ore.material_ru ?: material
            def product = ore.product ?: 'ingot'
            ore.display = ore.display ?: "$english Ore"
            ore.display_ru = ore.display_ru ?: "Руда $russian"
            ore.texture = ore.texture ?: "smog:block/${material}_ore"
            ore.deepslate_texture = ore.deepslate_texture ?: "smog:block/deepslate_${material}_ore"
            if (!(product in ['ingot','gem','none'])) throw new GradleException("Unknown material product: $product")
            def raw = "raw_$material", rawBlock = "raw_${material}_block", result = "${material}_$product"
            def metalBlock = "${material}_block", dust = "${material}_dust", crushed = "crushed_${material}_ore"
            def small = "${material}_nugget", shard = "${material}_shard", plate = "${material}_plate"
            def oreTags = (ore.tags ?: []) + ['smog:ores','c:ores',"c:ores/$material"]
            block(ore + [drop:"smog:$raw",tags:oreTags], name, ore.texture, false)
            block(ore + [drop:"smog:$raw",display:"Deepslate ${ore.display}", display_ru:"Глубинная ${ore.display_ru.toLowerCase()}", tags:oreTags], "deepslate_$name", ore.deepslate_texture, false)
            block([mining_level:ore.mining_level,display:"Raw $english Block",display_ru:"Блок необработанного $russian",tags:['c:storage_blocks',"c:storage_blocks/raw_$material"]], rawBlock, "smog:block/$rawBlock", false)
            if(product != 'none')block([mining_level:ore.mining_level,display:"$english Block",display_ru:"Блок $russian",tags:['c:storage_blocks',"c:storage_blocks/$material"]], metalBlock, "smog:block/$metalBlock", false)
            item(raw, "Raw $english", "Необработанная руда $russian", ['c:raw_materials',"c:raw_materials/$material"])
            if(product != 'none')item(result, "$english ${product == 'gem' ? 'Crystal' : 'Ingot'}", "${product == 'gem' ? 'Кристалл' : 'Слиток'} $russian", ["c:${product}s","c:${product}s/$material"])
            item(dust, "$english Dust", "Пыль $russian", ['c:dusts',"c:dusts/$material"])
            item(crushed, "Crushed $english Ore", "Дроблёная руда $russian", ['c:crushed_ores',"c:crushed_ores/$material"])
            if(product != 'none')item(small, "$english Nugget", "Самородок $russian", ['c:nuggets',"c:nuggets/$material"])
            item(shard, "$english Ore Shard", "Осколок руды $russian", ['c:ore_shards',"c:ore_shards/$material"])
            if(product != 'none')item(plate, "$english Plate", "Пластина $russian", ['c:plates',"c:plates/$material"])
            compact(rawBlock, "smog:$raw", "smog:$rawBlock")
            shapeless("${raw}_from_block", ["smog:$rawBlock"], "smog:$raw", 9)
            if(product != 'none') {
            compact(metalBlock, "smog:$result", "smog:$metalBlock")
            shapeless("${result}_from_block", ["smog:$metalBlock"], "smog:$result", 9)
            compact("${result}_from_small", "smog:$small", "smog:$result")
            shapeless(small, ["smog:$result"], "smog:$small", 9)
            [name, "deepslate_$name", raw, crushed, shard, dust].each { input ->
                ['smelting':200,'blasting':100].each { type, time ->
                    recipe("${result}_from_${type}_$input", [type:"minecraft:$type",group:result,ingredient:"smog:$input",result:[id:"smog:$result"],experience:0.7,cookingtime:time], "smog:$input")
                }
            }
            }
            def stoneTarget = ore.stone_replaceables ? [predicate_type:'minecraft:tag_match',tag:ore.stone_replaceables] :
                ore.biomes == 'nether' ? [predicate_type:'minecraft:tag_match',tag:'minecraft:base_stone_nether'] :
                ore.biomes == 'end' ? [predicate_type:'minecraft:block_match',block:'minecraft:end_stone'] :
                [predicate_type:'minecraft:tag_match',tag:'minecraft:stone_ore_replaceables']
            write("data/smog/worldgen/feature/${name}.json", [type:'minecraft:ore', size:ore.vein_size, discard_chance_on_air_exposure:0.0, targets:[
                [target:stoneTarget,state:"smog:$name"],
                [target:[predicate_type:'minecraft:tag_match',tag:ore.deepslate_replaceables ?: 'minecraft:deepslate_ore_replaceables'],state:"smog:deepslate_$name"]
            ]])
            write("data/smog/worldgen/placed_feature/${name}.json",[feature:"smog:$name",placement:resourcePlacement(ore)])

        }
        def processedMetals=(root.alloys ?: []) + (root.metals ?: [])
        processedMetals.each { alloy ->
            def n=alloy.name;def enName=alloy.material;def ruName=alloy.material_ru
            item(n+'_ingot',enName+' Ingot','Слиток '+ruName,['c:ingots',"c:ingots/$n"])
            item(n+'_dust',enName+' Dust','Пыль '+ruName,['c:dusts',"c:dusts/$n"])
            item(n+'_nugget',enName+' Nugget','Самородок '+ruName,['c:nuggets',"c:nuggets/$n"])
            item(n+'_plate',enName+' Plate','Пластина '+ruName,['c:plates',"c:plates/$n"])
            block([mining_level:alloy.mining_level,display:enName+' Block',display_ru:'Блок '+ruName,tags:['c:storage_blocks',"c:storage_blocks/$n"]],n+'_block',"smog:block/${n}_block",false)
            compact(n+'_block',"smog:${n}_ingot","smog:${n}_block")
            shapeless(n+'_ingot_from_block',["smog:${n}_block"],"smog:${n}_ingot",9)
            compact(n+'_ingot_from_nuggets',"smog:${n}_nugget","smog:${n}_ingot")
            shapeless(n+'_nugget',["smog:${n}_ingot"],"smog:${n}_nugget",9)
            if(alloy.ingredients)shapeless(n+'_dust',alloy.ingredients,"smog:${n}_dust",1)
            [smelting:200,blasting:100].each { type,time -> recipe(n+'_ingot_from_'+type,[type:"minecraft:$type",ingredient:"smog:${n}_dust",result:[id:"smog:${n}_ingot"],experience:0.7,cookingtime:time],"smog:${n}_dust") }
        }
        def undergroundFeature={ resourceName,blockState,parameters,exposureChance -> naturalMass(resourceName,blockState,blockState,parameters) };
        (root.deposits ?: []).each { entry ->
            def n=entry.name;def material=entry.material;def russianName=entry.material_ru
            block([mining_level:entry.mining_level,display:material,display_ru:entry.display_ru,tags:['smog:nonmetal_deposits',"c:stones/$n"]],n,"smog:block/$n",false)
            item(n+'_chunk',material+' Chunk','Кусок '+russianName,['smog:nonmetal_materials',"c:raw_materials/$n"])
            item(n+'_dust',material+' Dust','Пыль '+russianName,['c:dusts',"c:dusts/$n"])
            undergroundFeature(n+'_deposit',"smog:$n",entry,0d)
        }
        (root.underground_resources ?: []).each { entry -> undergroundFeature(entry.name,"smog:${entry.fluid}",entry,1d) }
        (root.items ?: []).each { entry ->
            item(entry.name,entry.display ?: entry.name,entry.display_ru ?: entry.name,entry.tags ?: [])
            if(entry.model)write("assets/smog/items/${entry.name}.json",[model:[type:'minecraft:model',model:entry.model]])
            if(entry.kind=='tool_mold')write("assets/smog/models/item/${entry.name}.json",[parent:'minecraft:item/generated',textures:[layer0:"smog:item/tool_molds/${entry.raw?'unfired_':''}${entry.form}"]])
            if(entry.kind=='mold_variant') {
                write("assets/smog/models/item/${entry.name}.json",[parent:'minecraft:item/generated',textures:[layer0:"smog:item/casting_molds/${entry.base_mold}"]])
                write("assets/smog/items/${entry.name}.json",[model:[type:'minecraft:model',model:"smog:item/${entry.name}",tints:[[type:'minecraft:custom_model_data',index:0,default:entry.style=='sand'?0xE6CEA4:0xF3CB57]]]])
            }
            if(entry.kind=='tool_part') {
                def metadata=root.tool_parts["smog:${entry.name}"];def material=root.tool_materials.find { it.id==metadata.material };def form=root.tool_forms.find { it.id==metadata.form };def texture=(metadata.cast?'cast_':'')+form.id
                write("assets/smog/models/item/tool_forms/${texture}.json",[parent:'minecraft:item/handheld',textures:[layer0:"smog:item/tool_forms/$texture"]])
                write("assets/smog/models/item/${entry.name}.json",[parent:"smog:item/tool_forms/$texture"])
                write("assets/smog/items/${entry.name}.json",[model:[type:'minecraft:model',model:"smog:item/${entry.name}",tints:[[type:'minecraft:custom_model_data',index:0,default:Integer.parseInt(material.color.replace('#',''),16)]]]])
            }
            if(entry.kind=='modular_tool') {
                def schema=root.tool_templates.find { it.id==entry.template };def layers=[]
                schema.parts.eachWithIndex { role,partIndex ->
                    def options=[]
                    root.tool_forms.findAll { form -> form.category==role.category&&(!role.forms||form.id in role.forms) }.each { form ->
                        def layerModel="tool_layers/${schema.id}_${role.id}_${form.id}";def offset=role.offset?:[0,0,0];def visualGroup=form.category in ['binding','wrap']?'tool_overlays':'tool_forms'
                        if(visualGroup=='tool_overlays')write("assets/smog/models/item/tool_overlays/${form.id}.json",[parent:'minecraft:item/handheld',textures:[layer0:"smog:item/tool_overlays/${form.id}"]])
                        def display=[:];['gui','ground','fixed','firstperson_righthand','firstperson_lefthand','thirdperson_righthand','thirdperson_lefthand'].each { context -> def base=templateData.base_display?.get(context)?:[:];def position=base.translation?:[0,0,0];def scale=base.scale?:[1,1,1];display[context]=[rotation:base.rotation?:[0,0,0],translation:(0..<3).collect { axis -> position[axis]+offset[axis] },scale:scale.collect { it*(schema.render_scale?:1) }] }
                        write("assets/smog/models/item/${layerModel}.json",[parent:"smog:item/${visualGroup}/${form.id}",display:display])
                        options.add([when:form.id,model:[type:'minecraft:model',model:"smog:item/$layerModel",tints:[[type:'minecraft:custom_model_data',index:partIndex,default:0xFFFFFF]]]])
                    }
                    layers.add([type:'minecraft:select',property:'minecraft:custom_model_data',index:partIndex,cases:options,fallback:[type:'minecraft:empty']])
                }
                write("assets/smog/models/item/${entry.name}.json",[parent:'minecraft:item/generated',textures:[layer0:'smog:item/tool_forms/pickaxe_head']])
                write("assets/smog/items/${entry.name}.json",[model:[type:'minecraft:composite',models:layers]])
            }
        }
        root.machines.each { block(it, it.name, it.texture, true) }
        (root.crafting ?: []).each { entry -> recipe(entry.name,entry.data,entry.unlock) }
        (root.firing ?: []).each { entry -> recipe(entry.output.split(':')[1]+'_firing',[type:'minecraft:smelting',ingredient:entry.input,result:[id:entry.output],experience:0.1,cookingtime:200],entry.input) }
        root.blocks.findAll { it.recipe_core }.each { entry ->
            recipe(entry.name,[type:'minecraft:crafting_shaped',pattern:['III','ICI','III'],key:[I:'minecraft:iron_ingot',C:entry.recipe_core],result:[id:"smog:${entry.name}",count:entry.recipe_count ?: 1]],entry.recipe_core)
        }
        root.machines.findAll { it.recipe_core }.each { entry ->
            recipe(entry.name,[type:'minecraft:crafting_shaped',pattern:['CCC','RIR','CCC'],key:[C:entry.casing_item ?: 'smog:machine_casing',R:'minecraft:redstone',I:entry.recipe_core],result:[id:"smog:${entry.name}"]],entry.recipe_core)
        }
        (root.items ?: []).findAll { it.kind == 'wire' }.each { coil ->
            shapeless(coil.name,[coil.ingredient,coil.ingredient,'minecraft:string'],"smog:${coil.name}",4)
        }
        if((root.items ?: []).any { it.name == 'wrench' }){ recipe('wrench',[type:'minecraft:crafting_shaped',pattern:['I I',' I ',' I '],key:[I:'minecraft:iron_ingot'],result:[id:'smog:wrench']],'minecraft:iron_ingot') }
        if(root.blocks.any { it.name == 'machine_casing' }){ recipe('machine_casing', [type:'minecraft:crafting_shaped',category:'building',pattern:['I I',' C ','I I'],key:[I:'minecraft:iron_ingot',C:'minecraft:copper_ingot'],result:[id:'smog:machine_casing',count:4]], 'minecraft:iron_ingot') }
        if(root.machines.any { it.name == 'test_machine' }){ recipe('test_machine', [type:'minecraft:crafting_shaped',pattern:['CCC','RFR','CCC'],key:[C:'smog:machine_casing',R:'minecraft:redstone',F:'minecraft:furnace'],result:[id:'smog:test_machine']], 'smog:machine_casing') }
        if(root.machines.any { it.name == 'test_controller' }){ recipe('test_controller', [type:'minecraft:crafting_shaped',pattern:['CRC','RMR','CRC'],key:[C:'smog:machine_casing',R:'minecraft:redstone',M:'smog:test_machine'],result:[id:'smog:test_controller']], 'smog:test_machine') }
        root.fluids.each { fluid ->
            claim(fluid.name); claim("flowing_${fluid.name}"); claim("${fluid.name}_bucket")
            def name = fluid.name
            write("assets/smog/blockstates/${name}.json", [variants:['':[model:'minecraft:block/water']]])
            write("assets/smog/models/item/${name}_bucket.json", [parent:'minecraft:item/generated',textures:[layer0:fluid.bucket_texture ?: 'minecraft:item/water_bucket']])
            write("assets/smog/items/${name}_bucket.json", [model:[type:'minecraft:model',model:"smog:item/${name}_bucket"]])
            en["block.smog.${name}"] = fluid.display; ru["block.smog.${name}"] = fluid.display_ru ?: fluid.display
            en["item.smog.${name}_bucket"] = "${fluid.display} Bucket"
            ru["item.smog.${name}_bucket"] = "Ведро: ${fluid.display_ru}"
            if (name == 'coolant') shapeless('coolant_bucket', ['minecraft:bucket','minecraft:snowball','minecraft:lapis_lazuli'], 'smog:coolant_bucket', 1)
            ((fluid.water_like == false ? [] : ['minecraft:water']) + (fluid.tags ?: [])).each { t -> tag('fluid',t,"smog:$name"); tag('fluid',t,"smog:flowing_$name") }
        }
        (root.tags ?: []).each { entry ->
            if (!(entry.registry ==~ /[a-z0-9_\/]+/)) throw new GradleException("Invalid tag registry ${entry.registry}")
            entry.values.each { value -> tag(entry.registry, entry.id, value) }
        }
        tags.each { path, values -> write(path,[replace:false,values:values.toList()]) }
        ['machines':['Smog: Machines','Smog: Механизмы'],ores:['Smog: Ores & Materials','Smog: Руды и материалы'],blocks:['Smog: Blocks & Fluids','Smog: Блоки и жидкости']].each { key, text ->
            en["itemGroup.smog.$key"] = text[0]; ru["itemGroup.smog.$key"] = text[1]
        }
        en['tag.item.smog.machine_casings'] = 'Machine Casings'; ru['tag.item.smog.machine_casings'] = 'Корпуса механизмов'
        en['tag.item.smog.ores'] = 'Smog Ores'; ru['tag.item.smog.ores'] = 'Руды Smog'
        en['jei.smog.multiblocks'] = 'Multiblock Structures'; ru['jei.smog.multiblocks'] = 'Мультиблочные структуры'
        en['jei.smog.blueprint'] = 'Structure'; ru['jei.smog.blueprint'] = 'Структура'
        en['jei.smog.formed'] = 'Assembled'; ru['jei.smog.formed'] = 'Собрано'
        en['jei.smog.controls'] = 'Drag: rotate | Wheel: zoom'; ru['jei.smog.controls'] = 'ЛКМ: поворот | Колесо: зум'
        en['jei.smog.controls_more'] = 'RMB: form | MMB: reset'; ru['jei.smog.controls_more'] = 'ПКМ: сборка | СКМ: сброс'
        en['gui.smog.on']='On';ru['gui.smog.on']='Вкл.'
        en['gui.smog.off']='Off';ru['gui.smog.off']='Выкл.'
        en['gui.smog.toggle_power']='Toggle machine';ru['gui.smog.toggle_power']='Включить / выключить'
        en['gui.smog.change_rate']='Change output limit (FE/t)';ru['gui.smog.change_rate']='Изменить предел передачи (FE/т)'
        [copper:['Copper','Медь'],aluminum:['Aluminum','Алюминий'],silver:['Silver','Серебро'],steel:['Steel','Сталь'],gold:['Gold','Золото'],tin:['Tin','Олово']].each { key,text -> en["conductor.smog.$key"]=text[0];ru["conductor.smog.$key"]=text[1] }
        en['message.smog.multiblock_formed']='Multiblock assembled';ru['message.smog.multiblock_formed']='Мультиблок собран'
        en['message.smog.multiblock_incomplete']='Structure incomplete or obstructed. Check the JEI blueprint.';ru['message.smog.multiblock_incomplete']='Структура неполная или занята. Проверьте схему в JEI.'
        en['message.smog.configurator_rotated']='Rotated; configure again to assemble';ru['message.smog.configurator_rotated']='Повернуто; для сборки нажмите настройщиком снова'
        en['message.smog.connector_required'] = 'Use a connector made from %s';ru['message.smog.connector_required'] = 'Нужен коннектор из материала: %s'
        en['message.smog.wire_start'] = 'First connector selected. Click the second connector.';ru['message.smog.wire_start'] = 'Первый коннектор выбран. Нажмите на второй.'
        en['message.smog.wire_invalid'] = 'Invalid connection. Maximum distance: %s blocks.';ru['message.smog.wire_invalid'] = 'Неверное соединение. Максимум: %s блоков.'
        en['message.smog.wire_obstructed'] = 'The wire path is obstructed or unloaded.';ru['message.smog.wire_obstructed'] = 'На пути провода препятствие или незагруженный чанк.'
        [none:['Incomplete','Не собран'],solar:['Solar','Солнечный'],lightning:['Lightning','Молниевой'],thermal:['Thermal','Тепловой'],flow:['Flow turbine','Потоковый'],wind:['Wind','Ветряной'],steam:['Steam','Паровой'],geothermal:['Geothermal','Геотермальный']].each { key,text ->
            en["generator.smog.$key"]=text[0];ru["generator.smog.$key"]=text[1]
        }
        root.multiblocks.each { entry ->
            en["multiblock.smog.${entry.name}"] = entry.display ?: entry.name
            ru["multiblock.smog.${entry.name}"] = entry.display_ru ?: entry.display ?: entry.name
        }
        root.tool_templates.each { schema -> en["tool.smog.template.${schema.id}"]=schema.name.en_us;ru["tool.smog.template.${schema.id}"]=schema.name.ru_ru }
        en.putAll(root.translations?.en_us ?: [:]);ru.putAll(root.translations?.ru_ru ?: [:]);
        write('assets/smog/lang/en_us.json',en); write('assets/smog/lang/ru_ru.json',ru)
        write('smog.content.json',root)
    }
}
def catalogFile = layout.projectDirectory.file('src/main/content/smog.content.json')
def generatedContent = layout.buildDirectory.dir('generated/smog-content')
tasks.register('generateContent', GenerateSmogContent) {
    it.catalogFile.set(catalogFile)
    it.toolMaterialsDirectory.set(layout.projectDirectory.dir('src/main/content/tool_materials'))
    it.toolTemplatesFile.set(layout.projectDirectory.file('src/main/content/tool_templates.json'))
    it.targetDirectory.set(generatedContent)
}
sourceSets.main.resources.srcDir(generatedContent)
tasks.named('processResources') { dependsOn('generateContent') }
tasks.named('sourcesJar') { dependsOn('generateContent'); from(catalogFile) { into('content') }; from(layout.projectDirectory.file('src/main/content/tool_templates.json')) { into('content') }; from(layout.projectDirectory.dir('src/main/content/tool_materials')) { into('content/tool_materials') } }
