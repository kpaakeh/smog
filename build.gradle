plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = 'smog'
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'smog' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "teamreborn:energy:5.0.0"
    include "teamreborn:energy:5.0.0"
    compileOnly "mezz.jei:jei-26.3-common-api:31.17.0.94"
    clientCompileOnly "mezz.jei:jei-26.3-common-api:31.17.0.94"
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly 'maven.modrinth:jei:31.17.0.94'
        runtimeOnly 'maven.modrinth:mezzconfig:0.6.9'
    }
}


processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

apply from: 'gradle/content.gradle'

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'smog_tests'
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    gametestCompileOnly "mezz.jei:jei-26.3-common-api:31.17.0.94"
}

jar {
    from('LICENSE') {
        rename { "${it}_smog" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

// Run the copper scene in isolation; legacy foundation scenes keep their default behavior.

if(providers.gradleProperty('copperTest').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dsmog.copperTest=true' }
}
if(providers.gradleProperty('logisticsTest').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dsmog.logisticsTest=true' }
}
if(providers.gradleProperty('testLanguage').isPresent()) {
    def testLanguage=providers.gradleProperty('testLanguage').get()
    if(!(testLanguage in ['en_us','ru_ru']))throw new GradleException('testLanguage must be en_us or ru_ru')
    loom.runs.named('clientGameTest') { vmArg "-Dsmog.testLanguage=$testLanguage" }
}

// Isolated GameTest worlds are reused by Loom; their historical wire links otherwise
// accumulate until the production 512-link cap prevents unrelated fresh fixtures.
def smogGameTestWireFile = layout.buildDirectory.file('run/gameTest/world/dimensions/minecraft/overworld/data/smog/wires.dat')
def smogGameTestBuildRoot = layout.buildDirectory
tasks.named('runGameTest') {
    doFirst {
        def buildRoot = smogGameTestBuildRoot.get().asFile.canonicalFile
        def savedWires = smogGameTestWireFile.get().asFile.canonicalFile
        if (!savedWires.path.startsWith(buildRoot.path + File.separator)) {
            throw new GradleException('GameTest wire cleanup escaped the build directory')
        }
        if (savedWires.exists() && !savedWires.delete()) {
            throw new GradleException('Cannot reset the isolated GameTest wire fixture')
        }
    }
}

// Isolated world visual matrix; does not launch the multiplayer peer harness.
if(providers.gradleProperty('visualReviewTest').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dsmog.visualReviewTest=true' }
}

apply from: 'gradle/decor.gradle'

if(providers.gradleProperty("scaleReviewTest").isPresent()) { loom.runs.named("clientGameTest") { vmArg "-Dsmog.scaleReviewTest=true" } }

if(providers.gradleProperty("catalogVisualTest").isPresent()) { loom.runs.named("clientGameTest") { vmArg "-Dsmog.catalogVisualTest=true" } }

apply from: 'gradle/texture-review.gradle'

if(providers.gradleProperty('bronzeRegistrationTest').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dsmog.bronzeRegistrationTest=true' }
}

if(providers.gradleProperty("closureTest").isPresent()){loom.runs.named("clientGameTest"){vmArg "-Dsmog.closureTest=true"}}

if(providers.gradleProperty("closureWorldOnly").isPresent()){loom.runs.named("clientGameTest"){vmArg "-Dsmog.closureWorldOnly=true"}}

if(providers.gradleProperty("closureDecorOnly").isPresent()){loom.runs.named("clientGameTest"){vmArg "-Dsmog.closureDecorOnly=true"}}

if(providers.gradleProperty("texturePolishTest").isPresent()){loom.runs.named("clientGameTest"){vmArg "-Dsmog.texturePolishTest=true";vmArg "-Dsmog.reviewDate=2026-11-04"}}

if(providers.gradleProperty("cartTextureReviewTest").isPresent()){loom.runs.named("clientGameTest"){vmArg "-Dsmog.cartTextureReviewTest=true";vmArg "-Dsmog.cartReviewFolder=cart-final"}}
