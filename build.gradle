plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = 'smog'
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'smog' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "teamreborn:energy:5.0.0"
    include "teamreborn:energy:5.0.0"
    compileOnly "mezz.jei:jei-26.3-common-api:31.17.0.94"
    clientCompileOnly "mezz.jei:jei-26.3-common-api:31.17.0.94"
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly 'maven.modrinth:jei:31.17.0.94'
        runtimeOnly 'maven.modrinth:mezzconfig:0.6.9'
    }
}


processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

apply from: 'gradle/content.gradle'

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'smog_tests'
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    gametestCompileOnly "mezz.jei:jei-26.3-common-api:31.17.0.94"
}

jar {
    from('LICENSE') {
        rename { "${it}_smog" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

// Run the copper scene in isolation; legacy foundation scenes keep their default behavior.
if(providers.gradleProperty('copperTest').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dsmog.copperTest=true' }
}
if(providers.gradleProperty('logisticsTest').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dsmog.logisticsTest=true' }
}
